apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-html-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: index-html
  template:
    metadata:
      labels:
        app: index-html
    spec:
      containers:
      - name: index-html
        image: sgolilla/index-html:15
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: index-html-service
spec:
  type: NodePort
  selector:
    app: index-html
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
